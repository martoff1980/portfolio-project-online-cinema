[tool.poetry]
name = "online-cinema-auth"
version = "0.1.0"
description = "Online Cinema Authentication Service"
authors = ["Dmytro Breus <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = "^0.28.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.28"}
asyncpg = "^0.29.0"
alembic = "^1.13.1"
pydantic = {extras = ["email"], version = "^2.6.4"}
pydantic-settings = "^2.2.1"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
pyjwt = {extras = ["crypto"], version = "^2.8.0"}
celery = {extras = ["redis"], version = "^5.3.6"}
redis = "^5.0.3"
aiosmtplib = "^3.0.1"  # Для асинхронной отправки email

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"